<script>
  function renderBlogCard(post) {
    const date = new Date(post.published_at).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
    return `
      <a href="blog-post.html?slug=${post.slug}" class="blog-card">
        <div class="blog-image"><img src="${post.cover_image || 'https://images.unsplash.com/photo-1596755094514-f87e34085b2c?q=80&w=600'}" alt="${post.title}"></div>
        <p class="blog-date">${date}</p>
        <h3 class="blog-title">${post.title}</h3>
        <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 0.4rem;">${post.excerpt || ''}</p>
      </a>`;
  }

  async function loadBlog() {
    const grid = document.getElementById('blog-grid');
    const posts = await fetchBlogPosts();
    if (!posts.length) {
      grid.innerHTML = `<div class="empty-state" style="grid-column: 1/-1;"><h3>No journal entries yet</h3><p>Posts added from the admin panel will appear here.</p></div>`;
      return;
    }
    grid.innerHTML = posts.map(renderBlogCard).join('');
  }
  loadBlog();
</script>
