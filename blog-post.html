<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/main.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const slug = params.get('slug');

  async function init() {
    if (!slug) {
      document.getElementById('post-container').innerHTML = `<div class="empty-state"><h3>Post not found</h3></div>`;
      return;
    }
    const post = await fetchBlogPostBySlug(slug);
    if (!post) {
      document.getElementById('post-container').innerHTML = `<div class="empty-state"><h3>Post not found</h3><p>This entry may have been removed.</p></div>`;
      return;
    }
    document.getElementById('page-title').textContent = post.title + ' — THE CHICKANKARI STUDIO';
    document.getElementById('breadcrumb-title').textContent = post.title;
    const date = new Date(post.published_at).toLocaleDateString('en-IN', { day: 'numeric', month: 'long', year: 'numeric' });
    const paragraphs = (post.content || '').split('\n').filter(p => p.trim()).map(p => `<p>${p}</p>`).join('');
    document.getElementById('post-container').innerHTML = `
      <div class="post-header">
        <p class="eyebrow">${date} · ${post.author || 'The Chickankari Studio'}</p>
        <h1 style="margin-top: 0.8rem;">${post.title}</h1>
      </div>
      ${post.cover_image ? `<div class="post-cover"><img src="${post.cover_image}" alt="${post.title}"></div>` : ''}
      <div class="post-body">${paragraphs}</div>
    `;
  }
  init();
</script>
</body>
</html>
