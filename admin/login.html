<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — THE CHICKANKARI STUDIO</title>
<link rel="icon" href="../assets/logo.png">
<link rel="stylesheet" href="../css/style.css">
<style>
  body { background: var(--black); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .login-box { max-width: 380px; width: 100%; padding: 2.8rem; border: 1px solid var(--line); background: var(--charcoal); text-align: center; }
  .login-box img { height: 64px; margin: 0 auto 1.2rem; }
  .login-box h1 { color: var(--ivory); font-size: 1.5rem; margin-bottom: 0.4rem; }
  .login-box p.sub { color: var(--cream); font-size: 0.85rem; margin-bottom: 2rem; opacity: 0.75; }
  .login-box .form-field { text-align: left; margin-bottom: 1.2rem; }
  .login-box .form-field label { color: var(--cream); }
  .login-box .form-field input { background: var(--black); border-color: var(--line); color: var(--ivory); }
  #login-error { color: #e07a6e; font-size: 0.85rem; margin-top: 1rem; display: none; }
</style>
</head>
<body>

<div class="login-box">
  <img src="../assets/logo.png" alt="The Chickankari Studio">
  <h1>Studio Admin</h1>
  <p class="sub">Sign in to manage products, orders and content</p>
  <form id="login-form">
    <div class="form-field"><label for="email">Email</label><input type="email" id="email" required></div>
    <div class="form-field"><label for="password">Password</label><input type="password" id="password" required></div>
    <button type="submit" class="btn btn-primary" id="login-btn" style="width:100%; justify-content:center;">Sign In</button>
    <p id="login-error">Incorrect email or password.</p>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-config.js"></script>
<script>
  // If already logged in, go straight to dashboard
  supabaseClient.auth.getSession().then(({ data }) => {
    if (data.session) window.location.href = 'dashboard.html';
  });

  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('login-btn');
    const errorEl = document.getElementById('login-error');
    errorEl.style.display = 'none';
    btn.disabled = true;
    btn.textContent = 'Signing in…';

    const { error } = await supabaseClient.auth.signInWithPassword({
      email: document.getElementById('email').value,
      password: document.getElementById('password').value
    });

    if (error) {
      errorEl.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Sign In';
      return;
    }
    window.location.href = 'dashboard.html';
  });
</script>
</body>
</html>
